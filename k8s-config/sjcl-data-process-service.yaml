# 从 fet 命名空间导出的部署配置。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sjcl-data-process-service
  namespace: fet
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: sjcl-data-process-service
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-11-23T08:02:18.853Z"
      labels:
        app: sjcl-data-process-service
    spec:
      containers:
      - env:
        - name: SPRING_CLOUD_NACOS_SERVER_ADDR
          value: nacos.fet.svc.cluster.local:8848
        - name: SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR
          value: nacos.fet.svc.cluster.local:8848
        - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
          value: nacos.fet.svc.cluster.local:8848
        - name: SPRING_CLOUD_NACOS_CONFIG_NAMESPACE
          value: sjcl
        - name: SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE
          value: sjcl
        - name: SPRING_CLOUD_NACOS_CONFIG_GROUP
          value: DEFAULT_GROUP
        - name: SPRING_CLOUD_NACOS_DISCOVERY_GROUP
          value: DEFAULT_GROUP
        - name: SPRING_CLOUD_NACOS_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: sjcl-nacos-auth
        - name: SPRING_CLOUD_NACOS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: sjcl-nacos-auth
        - name: SPRING_CLOUD_NACOS_CONFIG_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: sjcl-nacos-auth
        - name: SPRING_CLOUD_NACOS_CONFIG_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: sjcl-nacos-auth
        - name: SPRING_CLOUD_NACOS_DISCOVERY_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: sjcl-nacos-auth
        - name: SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: sjcl-nacos-auth
        - name: JAVA_TOOL_OPTIONS
          value: -XX:ActiveProcessorCount=32 -XX:+UseG1GC
        image: 10.126.100.164:30444/sjcl/data-process-service:48df75c1
        imagePullPolicy: IfNotPresent
        name: sjcl-data-process-service
        ports:
        - containerPort: 8083
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 15
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: http
          timeoutSeconds: 2
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
        volumeMounts:
        - mountPath: /app/data/fep/temp
          name: fep-temp
        workingDir: /app
      dnsConfig:
        options:
        - name: ndots
          value: "2"
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      imagePullSecrets:
      - name: sjcl-harbor-pull
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: worker01
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - hostPath:
          path: /data/sjcl/process/fep/temp
          type: DirectoryOrCreate
        name: fep-temp
