# 从 fet 命名空间导出的部署配置。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sjcl-data-admin-service
  namespace: fet
spec:
  progressDeadlineSeconds: 600
  replicas: 2
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: sjcl-data-admin-service
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-11-19T10:44:47.155Z"
      labels:
        app: sjcl-data-admin-service
    spec:
      containers:
      - env:
        - name: SPRING_CLOUD_NACOS_SERVER_ADDR
          value: nacos.fet.svc.cluster.local:8848
        - name: SPRING_CLOUD_NACOS_CONFIG_SERVER_ADDR
          value: nacos.fet.svc.cluster.local:8848
        - name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR
          value: nacos.fet.svc.cluster.local:8848
        - name: SPRING_CLOUD_NACOS_CONFIG_NAMESPACE
          value: sjcl
        - name: SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE
          value: sjcl
        - name: SPRING_CLOUD_NACOS_CONFIG_GROUP
          value: DEFAULT_GROUP
        - name: SPRING_CLOUD_NACOS_DISCOVERY_GROUP
          value: DEFAULT_GROUP
        - name: SPRING_CLOUD_NACOS_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: sjcl-nacos-auth
        - name: SPRING_CLOUD_NACOS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: sjcl-nacos-auth
        - name: SPRING_CLOUD_NACOS_CONFIG_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: sjcl-nacos-auth
        - name: SPRING_CLOUD_NACOS_CONFIG_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: sjcl-nacos-auth
        - name: SPRING_CLOUD_NACOS_DISCOVERY_USERNAME
          valueFrom:
            secretKeyRef:
              key: username
              name: sjcl-nacos-auth
        - name: SPRING_CLOUD_NACOS_DISCOVERY_PASSWORD
          valueFrom:
            secretKeyRef:
              key: password
              name: sjcl-nacos-auth
        image: 10.126.100.164:30444/sjcl/data-admin-service:48df75c1
        imagePullPolicy: IfNotPresent
        name: sjcl-data-admin-service
        ports:
        - containerPort: 8082
          name: http
          protocol: TCP
        readinessProbe:
          failureThreshold: 3
          initialDelaySeconds: 15
          periodSeconds: 10
          successThreshold: 1
          tcpSocket:
            port: http
          timeoutSeconds: 1
        resources: {}
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsConfig:
        options:
        - name: ndots
          value: "2"
      dnsPolicy: ClusterFirst
      imagePullSecrets:
      - name: sjcl-harbor-pull
      nodeSelector:
        kubernetes.io/arch: arm64
        kubernetes.io/hostname: worker01
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
